[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-agent"
version = "0.2.0"
description = "Claude-powered CLI agent that runs SAST/SCA/secret scanners, triages findings and plugs into CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9"]
scanners = ["semgrep>=1.80", "bandit>=1.7.9", "pip-audit>=2.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
devsecops-agent = "devsecops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests that exercise several components together"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.coverage.run]
source = ["devsecops_agent"]
omit = ["*/__main__.py"]
