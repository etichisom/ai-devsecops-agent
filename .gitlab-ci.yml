# GitLab CI/CD pipeline: lint -> test -> security scans -> report & gate -> SBOM -> container build & scan.
#
# Each scanner runs in its own job (and its own upstream image where one exists), then
# `devsecops-agent report` merges their JSON into one Markdown/JSON/JUnit report and applies
# the severity gate. Set ANTHROPIC_API_KEY as a masked CI/CD variable to add an AI triage summary.

stages:
  - lint
  - test
  - security
  - report
  - build

variables:
  FAIL_ON: "high"                 # gate: fail on findings at or above this severity
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_IMAGE: "python:3.12-slim"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]
  before_script:
    - python -m pip install --quiet -e ".[dev]"

# ---------------------------------------------------------------- lint

ruff:
  extends: .python
  stage: lint
  script:
    - ruff check src tests
    - ruff format --check src tests

# ---------------------------------------------------------------- test

pytest:
  extends: .python
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  script:
    - pytest --junitxml=reports/pytest.xml --cov --cov-report=term --cov-report=xml:reports/coverage.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

groovy-library:
  stage: test
  image: groovy:4.0-jdk17
  needs: []
  script:
    - groovy -cp ci/jenkins/src ci/jenkins/test/SecurityGateTest.groovy

# ---------------------------------------------------------------- security scans

.scan:
  stage: security
  needs: []
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 1 week
  before_script:
    - mkdir -p reports

semgrep:
  extends: .scan
  image: semgrep/semgrep:1.95.0
  script:
    - semgrep scan --config p/default --metrics=off --json --output reports/semgrep.json
      --exclude tests --exclude .venv .

bandit:
  extends: .scan
  image: $PYTHON_IMAGE
  script:
    - pip install --quiet bandit
    # bandit exits 1 when it finds issues; the report job applies the gate instead.
    - bandit -r src -f json -o reports/bandit.json || [ $? -eq 1 ]

pip-audit:
  extends: .scan
  image: $PYTHON_IMAGE
  script:
    - pip install --quiet pip-audit
    - pip-audit -r requirements.txt -f json -o reports/pip-audit.json --progress-spinner off || [ $? -eq 1 ]

gitleaks:
  extends: .scan
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0                  # scan the full history, not just the latest commit
  script:
    - gitleaks detect --source . --redact --no-banner --exit-code 0
      --report-format json --report-path reports/gitleaks.json

# ---------------------------------------------------------------- report & gate

security-report:
  extends: .python
  stage: report
  needs: [semgrep, bandit, pip-audit, gitleaks]
  script:
    - devsecops-agent report
      --semgrep reports/semgrep.json
      --bandit reports/bandit.json
      --pip-audit reports/pip-audit.json
      --gitleaks reports/gitleaks.json
      --out reports --fail-on "$FAIL_ON"
      ${ANTHROPIC_API_KEY:+--ai-summary}
  artifacts:
    when: always
    expose_as: "Security report"
    paths:
      - reports/security-report.md
      - reports/security-report.json
      - reports/security-junit.xml
    reports:
      junit: reports/security-junit.xml

sbom:
  extends: .python
  stage: report
  needs: []
  script:
    - pip install --quiet cyclonedx-bom
    - cyclonedx-py environment --output-format JSON --output-file reports/sbom.cdx.json
  artifacts:
    paths: [reports/sbom.cdx.json]
    reports:
      cyclonedx: reports/sbom.cdx.json

# ---------------------------------------------------------------- container

docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  needs: [pytest, security-report]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t devsecops-agent:$CI_COMMIT_SHORT_SHA .
    - docker save devsecops-agent:$CI_COMMIT_SHORT_SHA -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

container-scan:
  stage: build
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  needs: [docker-build]
  script:
    - trivy image --input image.tar --format json --output reports-trivy.json --exit-code 0
    - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
  artifacts:
    when: always
    paths: [reports-trivy.json]
